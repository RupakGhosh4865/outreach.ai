<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Outreach.ai</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 400px;
      height: 100vh;
      background: #0a0a0f;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    /* Loading screen while iframe loads */
    .loader {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      z-index: 10;
      gap: 16px;
      transition: opacity 0.3s;
    }

    .loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader-icon {
      font-size: 40px;
      animation: spin 2s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loader-text {
      font-size: 14px;
      color: #6b7280;
      font-family: 'JetBrains Mono', monospace;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 0;
    }

    /* Top bar showing captured job */
    .job-banner {
      background: rgba(99, 102, 241, 0.15);
      border-bottom: 1px solid rgba(99, 102, 241, 0.3);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
    }

    .job-banner-icon {
      font-size: 16px;
    }

    .job-banner-text {
      flex: 1;
    }

    .job-banner-title {
      font-size: 12px;
      font-weight: 600;
      color: #e8e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .job-banner-company {
      font-size: 11px;
      color: #6366f1;
    }

    .job-banner.hidden {
      display: none;
    }
  </style>
</head>

<body>

  <!-- Job detected banner -->
  <div class="job-banner hidden" id="jobBanner">
    <div class="job-banner-icon">⚡</div>
    <div class="job-banner-text">
      <div class="job-banner-title" id="bannerTitle">Loading job...</div>
      <div class="job-banner-company" id="bannerCompany">Detecting company...</div>
    </div>
  </div>

  <!-- Loading screen -->
  <div class="loader" id="loader">
    <div class="loader-icon">⚡</div>
    <div class="loader-text">Loading Outreach.ai...</div>
  </div>

  <!-- Your actual website loaded in iframe -->
  <!-- Note: Updating src to localhost:3000 for local development -->
  <iframe id="appFrame" src="http://localhost:3000/outreach?source=chrome-extension" allow="clipboard-write"
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>

  <!-- External script -->
  <script src="sidepanel.js"></script>
</body>

</html>
