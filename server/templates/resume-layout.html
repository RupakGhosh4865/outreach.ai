<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Resume</title>
<style>/*VARS*/</style>
<style>
  /* Sizes and margins are injected from the layout map derived from the user's
     own PDF, so this sheet only describes the arrangement — never the scale. */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--body-font);
    font-size: var(--body-size);
    /* Leading and block spacing are scaled together by --density so the
       renderer can tighten the page to match the original's page count
       without touching the type sizes read off the source PDF. */
    line-height: calc(1.34 * var(--density));
    color: #16181d;
  }

  header { margin-bottom: calc(10px * var(--density)); text-align: var(--header-align); }
  h1 {
    margin: 0;
    font-size: var(--name-size);
    font-weight: 700;
    letter-spacing: 0.4px;
  }
  .role { margin-top: 2px; font-size: calc(var(--body-size) + 1pt); color: #3c4149; }
  .contact { margin-top: 4px; font-size: calc(var(--body-size) - 0.3pt); color: #33383f; }
  .contact div + div { margin-top: 1px; }
  .contact a { color: #1a4f8b; text-decoration: none; }

  section { margin-bottom: calc(9px * var(--density)); }
  section:last-child { margin-bottom: 0; }

  h2 {
    margin: 0 0 calc(4px * var(--density));
    padding-bottom: 2px;
    font-size: var(--heading-size);
    font-weight: 700;
    border-bottom: 0.6pt solid #b9bec6;
  }

  p { margin: 0 0 calc(3px * var(--density)); }

  /* Entry header: title left, dates or location right, on one line — the
     two-column arrangement CVs use and the old renderer dropped. */
  .entry { margin-bottom: calc(6px * var(--density)); }
  .entry:last-child { margin-bottom: 0; }
  .entry-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  .entry-title { font-weight: 700; }
  .entry-meta { flex-shrink: 0; white-space: nowrap; color: #3c4149; }
  .entry-sub { font-style: italic; color: #3c4149; }

  /* Skills tables: a bold category in a fixed left column with its values
     beside it, as in the source document. */
  .labeled { display: flex; gap: 10px; margin-bottom: calc(1.5px * var(--density)); }
  .labeled-key { flex: 0 0 auto; min-width: 92px; font-weight: 700; }
  .labeled-val { flex: 1 1 auto; }

  ul { margin: calc(2px * var(--density)) 0 0; padding-left: 15px; }
  li { margin-bottom: calc(1.5px * var(--density)); }

  /* Cover letter: same header and type as the CV, prose body. */
  .letter { margin-top: 18px; }
  .letter p { margin: 0 0 10px; text-align: left; }
  .letter-date { color: #3c4149; margin-bottom: 16px !important; }
  .letter-sign { margin-top: 18px !important; }

  /* Keep a heading with its first entry, and never split an entry across
     pages — the original document didn't, and page breaks are the most
     visible way a "same layout" claim falls apart. */
  h2, .entry { break-inside: avoid; page-break-inside: avoid; }
  h2 { break-after: avoid; page-break-after: avoid; }
</style>
</head>
<body>
<!--RESUME-->
</body>
</html>
