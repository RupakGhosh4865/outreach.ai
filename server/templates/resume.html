<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Resume</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Calibri", "Carlito", "Helvetica Neue", Arial, sans-serif;
    font-size: 10.5pt;
    line-height: 1.35;
    color: #1a1a1a;
  }
  header { text-align: center; margin-bottom: 12px; }
  h1 {
    margin: 0;
    font-size: 21pt;
    letter-spacing: 0.5px;
    font-weight: 700;
  }
  .role { font-size: 11pt; color: #444; margin-top: 2px; }
  .contact { margin-top: 5px; font-size: 9.5pt; color: #333; }
  .contact a { color: #1a4f8b; text-decoration: none; }
  .contact > * + *::before {
    content: "";
    display: inline-block;
    width: 3px; height: 3px;
    margin: 0 7px 2px;
    border-radius: 50%;
    background: #999;
    vertical-align: middle;
  }

  section { margin-bottom: 11px; }
  h2 {
    font-size: 10.5pt;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin: 0 0 5px;
    padding-bottom: 2px;
    border-bottom: 1px solid #333;
  }
  p { margin: 0; text-align: justify; }

  ul { margin: 3px 0 0; padding-left: 16px; }
  li { margin-bottom: 2px; }

  ul.skills { list-style: none; padding-left: 0; }
  ul.skills .cat { font-weight: 700; }

  .entry { margin-bottom: 7px; page-break-inside: avoid; }
  .entry-head { display: flex; justify-content: space-between; gap: 10px; }
  .entry-title { font-weight: 700; }
  .entry-meta { color: #555; font-size: 9.5pt; white-space: nowrap; }
  .entry-sub { color: #444; font-style: italic; font-size: 10pt; }
</style>
</head>
<body>
<!--RESUME-->
</body>
</html>
